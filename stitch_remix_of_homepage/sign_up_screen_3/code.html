<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign Up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#13a4ec",
            "background-light": "#f6f7f8",
            "background-dark": "#101c22",
          },
          fontFamily: {
            "display": ["Manrope"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          keyframes: {
            fill: {
              '0%': { transform: 'scale(1)', backgroundColor: 'transparent' },
              '50%': { transform: 'scale(1.1)', backgroundColor: 'rgba(19, 164, 236, 0.2)' },
              '100%': { transform: 'scale(1)', backgroundColor: 'transparent' },
            }
          },
          animation: {
            fill: 'fill 0.5s ease-in-out',
          }
        },
      },
    }
  </script>
<style>
    .form-input::placeholder {
      color: #617c89;
    }
    .dark .form-input::placeholder {
      color: #a0aec0;
    }
    [x-cloak] {
      display: none !important;
    }
    .otp-input {
      width: 2.5rem;
      height: 3.5rem;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      border: none;
      border-bottom: 2px solid;
      background-color: transparent;
      transition: all 0.3s;
      padding-bottom: 0.5rem;
    }
    .light .otp-input {
      border-color: #d1d5db;
      color: #111827;
    }
    .dark .otp-input {
      border-color: #4b5563;
      color: #f9fafb;
    }
    .otp-input:focus {
      border-color: #13a4ec;
      outline: none;
      transform: scale(1.05);
    }
    body {
      min-height: max(884px, 100dvh);
    }
    .autofill-animation {
      animation: fill 0.6s ease-in-out;
    }
  </style>
<script defer="" src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display" x-data="{ otpModal: true }">
<div class="flex flex-col min-h-screen">
<div class="blur-sm">
<header class="flex justify-end p-4">
<button class="text-gray-800 dark:text-white">
<svg class="bi bi-question-circle" fill="currentColor" height="24" viewBox="0 0 16 16" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"></path>
<path d="M5.255 5.786a.237.237 0 0 0 .241.247h.825c.138 0 .248-.113.266-.25.09-.656.54-1.134 1.342-1.134.686 0 1.314.343 1.314 1.168 0 .635-.374.927-.965 1.371-.673.489-1.206 1.06-1.168 1.987l.003.217a.25.25 0 0 0 .25.246h.811a.25.25 0 0 0 .25-.25v-.105c0-.718.273-.927 1.01-1.486.609-.463 1.244-.977 1.244-2.056 0-1.511-1.276-2.241-2.673-2.241-1.267 0-2.655.59-2.75 2.286zm1.557 5.763c0 .533.425.927 1.01.927.609 0 1.028-.394 1.028-.927 0-.552-.42-.94-1.029-.94-.584 0-1.009.388-1.009.94z"></path>
</svg>
</button>
</header>
<main class="flex-grow flex flex-col justify-center px-6 sm:px-8">
<div class="w-full max-w-md mx-auto" x-data="{ accountType: 'provider' }">
<h1 class="text-3xl font-bold text-center text-gray-900 dark:text-white mb-4">Create your account</h1>
<p class="text-center text-gray-600 dark:text-gray-400 mb-8">Join our community of service providers and customers.</p>
<div class="mb-6">
<div class="flex border border-gray-300 dark:border-gray-600 rounded-lg p-1 bg-gray-100 dark:bg-gray-800 relative">
<div :class="{ 'translate-x-0': accountType === 'customer', 'translate-x-full': accountType === 'provider' }" class="absolute top-1 left-1 bottom-1 w-1/2 bg-primary rounded-md shadow-md transition-transform duration-300 ease-in-out"></div>
<button :class="{ 'text-white': accountType === 'customer', 'text-gray-600 dark:text-gray-400': accountType !== 'customer' }" @click="accountType = 'customer'" class="w-1/2 py-2 rounded-md font-semibold transition-colors duration-300 relative z-10">
                Customer
              </button>
<button :class="{ 'text-white': accountType === 'provider', 'text-gray-600 dark:text-gray-400': accountType !== 'provider' }" @click="accountType = 'provider'" class="w-1/2 py-2 rounded-md font-semibold transition-colors duration-300 relative z-10">
                Service Provider
              </button>
</div>
</div>
</div>
</main>
</div>
<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50" x-show="otpModal" x-transition:enter="transition ease-out duration-300" x-transition:enter-end="opacity-100" x-transition:enter-start="opacity-0" x-transition:leave="transition ease-in duration-200" x-transition:leave-end="opacity-0" x-transition:leave-start="opacity-100">
<div @click.away="otpModal = false" class="bg-background-light dark:bg-background-dark rounded-xl shadow-lg p-6 sm:p-8 w-full max-w-md mx-auto" x-data="{ 
          otp: ['', '', '', '', '', ''],
          autofilling: false,
          handleInput(index, e) {
              this.otp[index] = e.target.value.slice(0, 1);
              if (e.target.value &amp;&amp; index &lt; 5) {
                  this.$refs[`otp-input-${index + 1}`].focus();
              }
          },
          handleBackspace(index, e) {
              if (e.key === 'Backspace' &amp;&amp; !this.otp[index] &amp;&amp; index &gt; 0) {
                  this.$refs[`otp-input-${index - 1}`].focus();
              }
          },
          handlePaste(e) {
            e.preventDefault();
            const pastedData = e.clipboardData.getData('text').slice(0, 6);
            if (/^\d{6}$/.test(pastedData)) {
              this.autofilling = true;
              pastedData.split('').forEach((char, index) =&gt; {
                setTimeout(() =&gt; {
                  this.otp[index] = char;
                  const inputEl = this.$refs[`otp-input-${index}`];
                  if (inputEl) {
                    inputEl.classList.add('autofill-animation');
                    inputEl.addEventListener('animationend', () =&gt; {
                      inputEl.classList.remove('autofill-animation');
                    }, { once: true });
                  }
                }, index * 100);
              });
              setTimeout(() =&gt; {
                this.autofilling = false;
                this.$refs[`otp-input-5`].focus();
              }, 600);
            }
          }
      }" x-init="
        if ('OTPCredential' in window) {
            const ac = new AbortController();
            navigator.credentials.get({
                otp: { transport:['sms'] },
                signal: ac.signal
            }).then(otp =&gt; {
                if(otp &amp;&amp; otp.code) {
                  this.autofilling = true;
                  otp.code.split('').forEach((char, index) =&gt; {
                    setTimeout(() =&gt; {
                      this.otp[index] = char;
                       const inputEl = this.$refs[`otp-input-${index}`];
                       if (inputEl) {
                         inputEl.classList.add('autofill-animation');
                         inputEl.addEventListener('animationend', () =&gt; {
                          inputEl.classList.remove('autofill-animation');
                         }, { once: true });
                       }
                    }, index * 100);
                  });
                   setTimeout(() =&gt; {
                    this.autofilling = false;
                   }, 600);
                }
            }).catch(err =&gt; {
                console.log(err);
            });
        }
      ">
<div class="text-center">
<h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">Phone Verification</h2>
<p class="text-gray-600 dark:text-gray-400 mb-6">Enter the 6-digit code sent to your phone.</p>
<p class="text-xs text-gray-500 dark:text-gray-400 mb-8">Your phone may automatically suggest the code.</p>
</div>
<div @paste="handlePaste" class="flex justify-center gap-3 mb-8">
<template :key="index" x-for="(digit, index) in otp">
<input :x-ref="`otp-input-${index}`" @input="handleInput(index, $event)" @keydown="handleBackspace(index, $event)" autocomplete="one-time-code" class="otp-input light dark:otp-input" inputmode="numeric" maxlength="1" pattern="[0-9]" type="text" x-model="otp[index]"/>
</template>
</div>
<div class="text-center mb-6">
<p class="text-sm text-gray-600 dark:text-gray-400">Didn't receive the code?
            <button class="font-medium text-primary hover:underline">Resend OTP</button>
</p>
</div>
<button class="w-full bg-primary text-white font-bold py-4 px-4 rounded-lg hover:bg-primary/90 transition-colors duration-300">
          Verify
        </button>
</div>
</div>
</div>
</body></html>
