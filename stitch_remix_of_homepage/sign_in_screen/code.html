<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#13a4ec",
            "background-light": "#f6f7f8",
            "background-dark": "#101c22",
            "foreground-light": "#111827",
            "foreground-dark": "#f9fafb",
            "subtle-light": "#6b7280",
            "subtle-dark": "#9ca3af",
            "input-light": "#e5e7eb",
            "input-dark": "#1f2937",
          },
          fontFamily: {
            "display": ["Manrope", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-foreground-light dark:text-foreground-dark">
<div class="flex flex-col min-h-screen">
<header class="flex justify-end p-4">
<button class="p-2 rounded-full hover:bg-primary/10 dark:hover:bg-primary/20">
<span class="material-symbols-outlined text-subtle-light dark:text-subtle-dark">help</span>
</button>
</header>
<main class="flex-grow flex flex-col justify-center px-6 sm:px-8">
<div class="w-full max-w-sm mx-auto">
<div class="text-center mb-10">
<h1 class="text-3xl font-bold tracking-tight text-foreground-light dark:text-foreground-dark">Welcome back</h1>
<p class="mt-2 text-subtle-light dark:text-subtle-dark">Sign in to continue your journey.</p>
</div>
<form class="space-y-6">
<div>
<label class="sr-only" for="email">Email or phone number</label>
<input class="w-full h-14 px-4 bg-input-light dark:bg-input-dark border-transparent focus:ring-2 focus:ring-primary focus:border-transparent rounded-lg text-foreground-light dark:text-foreground-dark placeholder-subtle-light dark:placeholder-subtle-dark" id="email_phone" name="email_phone" placeholder="Email or phone number" type="text"/>
</div>
<div>
<label class="sr-only" for="password">Password</label>
<input class="w-full h-14 px-4 bg-input-light dark:bg-input-dark border-transparent focus:ring-2 focus:ring-primary focus:border-transparent rounded-lg text-foreground-light dark:text-foreground-dark placeholder-subtle-light dark:placeholder-subtle-dark" id="password" name="password" placeholder="Password" type="password"/>
</div>
<div class="text-right">
<a class="text-sm font-medium text-primary hover:underline" href="#">Forgot password?</a>
</div>
<div>
<button class="w-full flex justify-center py-4 px-4 border border-transparent rounded-lg shadow-sm text-base font-bold text-white bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary" type="submit">
              Sign in
            </button>
</div>
</form>
<div class="mt-8 relative">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-input-light dark:border-input-dark"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-background-light dark:bg-background-dark text-subtle-light dark:text-subtle-dark">Or sign in with</span>
</div>
</div>
<div class="mt-6 grid grid-cols-2 gap-4">
<button class="w-full inline-flex justify-center py-3 px-4 border border-input-light dark:border-input-dark rounded-lg shadow-sm bg-background-light dark:bg-input-dark text-sm font-medium text-foreground-light dark:text-foreground-dark hover:bg-input-light dark:hover:bg-primary/10">
<svg aria-hidden="true" class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24"><path clip-rule="evenodd" d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z" fill-rule="evenodd"></path></svg>
<span>Facebook</span>
</button>
<button class="w-full inline-flex justify-center py-3 px-4 border border-input-light dark:border-input-dark rounded-lg shadow-sm bg-background-light dark:bg-input-dark text-sm font-medium text-foreground-light dark:text-foreground-dark hover:bg-input-light dark:hover:bg-primary/10">
<svg aria-hidden="true" class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 48 48"><path d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22h-1.5z"></path></svg>
<span>Google</span>
</button>
</div>
</div>
</main>
<footer class="py-8 px-6 text-center">
<p class="text-sm text-subtle-light dark:text-subtle-dark">
        Don't have an account? 
        <a class="font-medium text-primary hover:underline" href="#">Sign up</a>
</p>
</footer>
</div>

</body></html>
