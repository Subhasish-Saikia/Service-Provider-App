<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Manrope%3Awght%40400%3B500%3B700%3B800&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900" onload="this.rel='stylesheet'" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#13ec5b",
              "background-light": "#f6f8f6",
              "background-dark": "#102216",
            },
            fontFamily: {
              display: ["Manrope"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
<title>Payment Success</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col justify-between overflow-x-hidden">
<header class="flex items-center justify-between p-4 bg-background-light dark:bg-background-dark">
<button class="text-gray-800 dark:text-gray-200">
<span class="material-symbols-outlined"> close </span>
</button>
<h1 class="flex-1 text-center text-lg font-bold text-gray-900 dark:text-white">
          Payment Successful
        </h1>
<div class="w-10"></div>
</header>
<main class="flex-grow">
<div class="px-4 py-8 text-center">
<div class="mx-auto flex h-24 w-24 items-center justify-center rounded-full bg-primary/20">
<div class="flex h-16 w-16 items-center justify-center rounded-full bg-primary">
<span class="material-symbols-outlined text-4xl text-white">
                check
              </span>
</div>
</div>
<h2 class="mt-6 text-2xl font-bold text-gray-900 dark:text-white">
            Payment Successful!
          </h2>
<p class="mt-2 text-base text-gray-600 dark:text-gray-300">
            Your payment has been processed successfully. You will receive a
            confirmation email shortly.
          </p>
</div>
<div class="mx-4 mb-8 rounded-lg bg-white dark:bg-black/20 p-4">
<h3 class="text-lg font-bold text-gray-900 dark:text-white">
            Booking Details
          </h3>
<div class="mt-4 space-y-4">
<div class="flex justify-between border-b border-gray-200 dark:border-gray-700 pb-4">
<p class="text-sm text-gray-500 dark:text-gray-400">
                Transaction ID
              </p>
<p class="text-sm font-medium text-gray-900 dark:text-white">
                #1234567890
              </p>
</div>
<div class="flex justify-between border-b border-gray-200 dark:border-gray-700 pb-4">
<p class="text-sm text-gray-500 dark:text-gray-400">Service</p>
<p class="text-sm font-medium text-gray-900 dark:text-white">
                Haircut
              </p>
</div>
<div class="flex justify-between border-b border-gray-200 dark:border-gray-700 pb-4">
<p class="text-sm text-gray-500 dark:text-gray-400">Provider</p>
<p class="text-sm font-medium text-gray-900 dark:text-white">
                Salon Elegance
              </p>
</div>
<div class="flex justify-between border-b border-gray-200 dark:border-gray-700 pb-4">
<p class="text-sm text-gray-500 dark:text-gray-400">Date</p>
<p class="text-sm font-medium text-gray-900 dark:text-white">
                July 20, 2024
              </p>
</div>
<div class="flex justify-between border-b border-gray-200 dark:border-gray-700 pb-4">
<p class="text-sm text-gray-500 dark:text-gray-400">Time</p>
<p class="text-sm font-medium text-gray-900 dark:text-white">
                2:00 PM
              </p>
</div>
<div class="flex justify-between">
<p class="text-sm text-gray-500 dark:text-gray-400">Amount</p>
<p class="text-sm font-medium text-gray-900 dark:text-white">
                $50.00
              </p>
</div>
</div>
</div>
</main>
<footer class="p-4 bg-background-light dark:bg-background-dark">
<div class="space-y-3">
<button class="flex w-full items-center justify-center rounded-lg bg-primary h-12 px-5 text-base font-bold text-black">
<span>View Booking Details</span>
</button>
<button class="flex w-full items-center justify-center rounded-lg bg-primary/20 dark:bg-primary/30 h-12 px-5 text-base font-bold text-gray-900 dark:text-white">
<span>Go to Home</span>
</button>
</div>
</footer>
</div>

</body></html>
